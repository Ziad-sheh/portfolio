<!doctype html>
<!-- Three layout directions for the homepage work section (2026-09-28). A mockup, not the site:
     it lives under scripts/, which Pages excludes. Every project keeps its explanation; sizes vary; order is unchanged.
     Choose a direction with ?v=a, ?v=b or ?v=c (or the buttons). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Work layouts · three directions</title>
  <link rel="stylesheet" href="../../fonts.css">
  <link rel="stylesheet" href="../../brands.css">
  <style>
    :root { --blue:#193d91; --butter:#fff6d5; --white:#fff; --ink:#172039; --red:#ac3448; --grey:#535b6d; --display:'Bricolage Grotesque',sans-serif; --body:'DM Sans',sans-serif; --hand:'Caveat',cursive; --gutter:clamp(18px,4.7vw,80px); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--white); color: var(--ink); font: 16px/1.55 var(--body); }
    img { display: block; max-width: 100%; }
    h2, h3, p { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
    .hand { font-family: var(--hand); font-weight: 400; }
    .bar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; padding: 12px var(--gutter); background: var(--blue); color: var(--butter); font-size: 13px; }
    .switch { display: inline-flex; border: 1.5px solid var(--butter); border-radius: 999px; overflow: hidden; }
    .switch button { padding: 7px 14px; font-weight: 600; font-size: 13px; }
    .switch button[aria-pressed="true"] { background: var(--butter); color: var(--blue); }
    .work { padding: 76px var(--gutter) 90px; }
    .inner { max-width: 1400px; margin: 0 auto; }
    .top { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 56px; }
    .top h2 { font: 800 clamp(68px,9vw,136px)/.95 var(--display); letter-spacing: -.075em; color: var(--blue); }
    .top h2 .hand { font-size: 1.08em; display: inline-block; transform: rotate(-7deg); letter-spacing: -.06em; margin-right: .05em; }
    .top p { max-width: 34ch; color: var(--grey); font-size: 14px; }
    .direction { display: none; }
    .direction.on { display: block; }

    /* Shared card parts */
    .print { position: relative; background: var(--white); padding: 10px; box-shadow: 0 6px 18px #17203920; transform: rotate(var(--turn, 0deg)); transition: transform .35s cubic-bezier(.2,.75,.2,1), box-shadow .35s; }
    .print img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
    .card:hover .print { transform: rotate(0deg) translateY(-5px); box-shadow: 0 14px 28px #17203926; }
    .brand { display: flex; align-items: center; height: 30px; }
    .brand .brand-mark { max-width: 104px; }
    .brand .brand-apple { --logo-height: 24px; }
    .brand .brand-land-rover { --logo-height: 30px; }
    .brand .brand-range-rover { width: 104px; }
    .brand .brand-fab { --logo-height: 24px; padding: 3px 7px; }
    .brand .brand-cartoon-network { --logo-height: 24px; padding: 4px 6px; }
    .brand .brand-la-vache-qui-rit { --logo-height: 34px; }
    .title { font-family: var(--display); font-weight: 800; letter-spacing: -.05em; line-height: 1; color: var(--blue); }
    .desc { color: var(--grey); }
    .role { font-size: 13px; color: var(--grey); }
    .role b { font-weight: 600; color: var(--ink); }
    .idx { font: 600 12px/1 var(--body); letter-spacing: .12em; color: var(--blue); }

    /* A · Magazine spread */
    .a-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 70px 34px; align-items: start; }
    .a-card { grid-column: span var(--span); }
    .a-card.drop { margin-top: 84px; }
    .a-card .head { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
    .a-card .title { margin-top: 8px; }
    .a-card[data-size="big"] .title { font-size: clamp(36px, 3.8vw, 58px); }
    .a-card[data-size="mid"] .title { font-size: clamp(28px, 2.6vw, 40px); }
    .a-card[data-size="small"] .title { font-size: clamp(22px, 1.9vw, 28px); letter-spacing: -.04em; }
    .a-card .desc { margin-top: 10px; max-width: 52ch; font-size: 15px; }
    .a-card[data-size="big"] .desc { font-size: 17px; color: var(--ink); }
    .a-card .role { margin-top: 10px; }

    /* B · Studio wall */
    .wall { background: var(--butter); border-radius: 4px; padding: 64px clamp(20px, 3vw, 48px) 90px; }
    .b-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 76px 38px; align-items: start; }
    .b-card { grid-column: span var(--span); transform: translateY(var(--y, 0)); }
    .b-card .print { padding: 9px 9px 0; }
    .b-card .print::after { content: ""; position: absolute; top: -13px; left: 50%; width: 96px; height: 28px; margin-left: -48px; background: #ffffffa8; box-shadow: 0 1px 3px #1720391a; transform: rotate(var(--tape, -3deg)); }
    .b-card .print img { margin-bottom: 0; }
    .b-card .note { min-height: 56px; padding: 10px 4px 20px; font: 400 clamp(22px, 1.9vw, 27px)/1.05 var(--hand); color: var(--blue); max-width: 64%; }
    .b-card:nth-child(3n + 1) .note { color: var(--red); }
    .b-card[data-size="big"] .note { font-size: clamp(25px, 2.2vw, 31px); }
    .label { position: relative; width: 88%; margin: -6px 0 0 auto; padding: 14px 16px 15px; background: var(--white); box-shadow: 0 4px 12px #17203918; transform: rotate(var(--lturn, 1deg)); }
    .label .top-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .label .title { margin-top: 8px; font-size: clamp(21px, 1.9vw, 30px); letter-spacing: -.04em; }
    .b-card[data-size="big"] .label .title { font-size: clamp(28px, 2.8vw, 42px); }
    .label .desc { margin-top: 6px; font-size: 14px; line-height: 1.45; }
    .label .role { margin-top: 8px; font-size: 12px; }

    /* B1 / B2 · sticky notes */
    .sticky { position: absolute; z-index: 3; padding: 16px 16px 18px; background: linear-gradient(170deg, #ffe37a 0%, #ffdc5e 88%, #f5cf4c 100%); box-shadow: 0 8px 14px -6px #17203955, 0 1px 2px #1720391f; transform: rotate(var(--sturn, 2deg)); font-family: var(--hand); color: var(--blue); }
    .b-card:nth-child(3n + 1) .sticky { color: var(--red); }
    .b1 .print, .b2 .print { padding: 9px; }
    .sticky.c-p { background: linear-gradient(170deg, #ffcdd5 0%, #ffbfca 88%, #f4adba 100%); }
    .sticky.c-b { background: linear-gradient(170deg, #d6e5ff 0%, #c7dbff 88%, #b5cdf5 100%); }
    .sticky.fix-pin::before { content: ""; position: absolute; top: -7px; left: 50%; width: 15px; height: 15px; margin-left: -7px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e46a7c, #ac3448 60%, #6e1b2b); box-shadow: 0 3px 4px #17203955; }
    .sticky.fix-pin.c-p::before { background: radial-gradient(circle at 35% 35%, #5b7fd6, #193d91 60%, #0f2560); }
    .sticky.fix-tape::before { content: ""; position: absolute; top: -11px; left: 50%; width: 64px; height: 21px; margin-left: -32px; background: #ffffffb0; box-shadow: 0 1px 2px #1720391a; transform: rotate(-5deg); }
    .b1 .sticky { width: var(--sw, 46%); max-width: 200px; min-width: 118px; min-height: 100px; font-size: clamp(22px, 1.9vw, 27px); line-height: 1.02; }
    .b1 .sticky.pos-br { right: -18px; bottom: -34px; }
    .b1 .sticky.pos-bl { left: -18px; bottom: -30px; }
    .b1 .sticky.pos-tr { right: -16px; top: -24px; }
    .b1 .sticky.pos-tl { left: -16px; top: -26px; }
    .b1 .sticky.pos-rm { right: -30px; top: 34%; }
    .b1 .sticky.pos-lm { left: -28px; top: 40%; }
    .b1 .caption.cap-right { margin-left: auto; }
    .b1 .caption.cap-full { max-width: 78%; }
    .b1 .caption { margin-top: 20px; max-width: 58%; }
    .b1 .caption .title { font-size: clamp(21px, 1.9vw, 30px); letter-spacing: -.04em; margin-top: 6px; }
    .b1 .b-card[data-size="big"] .caption .title { font-size: clamp(28px, 2.8vw, 42px); }
    .b1 .caption .desc { margin-top: 6px; font-size: 14px; line-height: 1.45; }
    .b1 .caption .role { margin-top: 8px; font-size: 12px; }
    .b2 .sticky { position: relative; width: var(--sw, 88%); margin-top: var(--st, -26px); transform: translateX(var(--sx, 0)) rotate(var(--sturn, 2deg)); }
    .b2 .sticky.side-r { margin-left: auto; }
    .b2 .sticky.side-l { margin-right: auto; }
    .b2 .sticky .s-title { font-size: clamp(30px, 2.6vw, 40px); line-height: .95; }
    .b2 .sticky .s-desc { margin-top: 8px; font-size: clamp(20px, 1.7vw, 24px); line-height: 1.08; }
    .b2 .sticky .s-role { margin-top: 10px; font-size: 19px; line-height: 1; opacity: .85; }
    .b2 .sticky .brand { margin-bottom: 4px; }
    @media (max-width: 600px) {
      .b1 .caption, .b1 .caption.cap-full { max-width: 100%; margin: 46px 0 0; }
      .b1 .sticky.pos-br, .b1 .sticky.pos-tr, .b1 .sticky.pos-rm { right: -6px; }
      .b1 .sticky.pos-bl, .b1 .sticky.pos-tl, .b1 .sticky.pos-lm { left: -6px; }
      .b2 .sticky { transform: rotate(var(--sturn, 2deg)); width: 94%; }
    }

    /* C · Exhibition */
    .c-row { display: grid; grid-template-columns: var(--cols); gap: clamp(28px, 4vw, 64px); align-items: center; padding: 56px 0; border-top: 1px solid #193d9120; }
    .c-row:first-child { border-top: 0; padding-top: 0; }
    .c-row.flip .print { order: 2; }
    .c-row .num { font: 800 clamp(54px, 6vw, 96px)/.8 var(--display); letter-spacing: -.07em; color: transparent; -webkit-text-stroke: 1.5px var(--blue); }
    .c-row .title { margin-top: 14px; font-size: clamp(34px, 4.4vw, 68px); letter-spacing: -.055em; }
    .c-row.compact .title { font-size: clamp(28px, 3.2vw, 48px); }
    .c-row .desc { margin-top: 14px; max-width: 44ch; font-size: 18px; color: var(--ink); }
    .c-row .role { margin-top: 14px; font-size: 14px; }
    .c-row .brand { margin-top: 16px; }

    @media (max-width: 900px) {
      .a-grid, .b-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .a-card, .b-card { grid-column: span var(--tspan); }
      .a-card.drop { margin-top: 0; }
      .b-card { transform: none; }
    }
    @media (max-width: 600px) {
      .a-grid, .b-grid { grid-template-columns: minmax(0, 1fr); gap: 54px; }
      .a-card, .b-card { grid-column: auto; }
      .c-row, .c-row.compact { grid-template-columns: minmax(0, 1fr); padding: 40px 0; }
      .c-row.flip .print { order: 0; }
      .top { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <span><strong>Work layouts</strong> — three directions, a mockup, not the live site</span>
    <div class="switch" role="group" aria-label="Direction"><button type="button" data-v="a">A · Magazine spread</button><button type="button" data-v="b">B · Studio wall</button><button type="button" data-v="b1">B1 · Sticky + typed</button><button type="button" data-v="b2">B2 · All handwritten</button><button type="button" data-v="c">C · Exhibition</button></div>
  </div>
  <section class="work">
    <div class="inner">
      <div class="top"><h2><span class="hand">the</span> Work</h2><p>All 18 projects, same order, each with its explanation and your role. Only the sizes and the arrangement change.</p></div>
      <div class="direction" id="a"><div class="a-grid" id="a-grid"></div></div>
      <div class="direction" id="b"><div class="wall"><div class="b-grid" id="b-grid"></div></div></div>
      <div class="direction" id="b1"><div class="wall"><div class="b-grid" id="b1-grid"></div></div></div>
      <div class="direction" id="b2"><div class="wall"><div class="b-grid" id="b2-grid"></div></div></div>
      <div class="direction" id="c"><div id="c-list"></div></div>
    </div>
  </section>
  <script src="../../work-data.js"></script>
  <script src="../../choices.js"></script>
  <script src="../../brands.js"></script>
  <script src="../../personal-touches.js"></script>
  <script>
    const esc = window.portfolioEscapeHtml;
    const P = window.PORTFOLIO_PROJECTS, C = window.COVER_CHOICES;
    const project = slug => P.find(p => p.slug === slug);
    const home = C.filter(c => !project(c.slug).parent);
    const img = c => '../../' + (c.gridImage || c.image);
    const brand = p => `<span class="brand">${window.portfolioBrandMarkup(p.client).replace(/src="brands\//g, 'src="../../brands/')}</span>`;
    const num = i => String(i + 1).padStart(2, '0');
    const size = span => span >= 7 ? 'big' : span >= 5 ? 'mid' : 'small';

    // A · spans keep the order; each row adds up to 12. Bigger campaigns land on the bigger slots.
    const aSpans = [7, 5, 8, 4, 4, 8, 4, 4, 4, 7, 5, 4, 8, 6, 6, 4, 4, 4];
    const aDrop = new Set([3, 4, 7, 11, 16]);
    const tablet = span => span >= 7 ? 6 : 3;
    document.getElementById('a-grid').innerHTML = home.map((c, i) => {
      const p = project(c.slug), span = aSpans[i];
      return `<article class="card a-card${aDrop.has(i) ? ' drop' : ''}" data-size="${size(span)}" style="--span:${span};--tspan:${tablet(span)};--turn:${[-0.8, 0.6, -0.4, 0.8, -0.6, 0.5][i % 6]}deg">
        <figure class="print" style="margin:0"><img src="${img(c)}" alt="${esc(c.alt)}" loading="lazy" style="object-position:${c.gridPosition || c.position}"></figure>
        <div class="head">${brand(p)}</div>
        <h3 class="title">${esc(p.title)}</h3><p class="desc">${esc(p.deck)}</p><p class="role">My role · <b>${esc(p.role)}</b></p></article>`;
    }).join('');

    // B · prints pinned on a wall: mixed sizes, small tilts, tape and a typed label.
    const bSpans = [6, 3, 3, 4, 4, 4, 5, 7, 3, 5, 4, 6, 6, 4, 3, 5, 6, 6];
    const turns = [-2, 1.6, -1.2, 2.2, -1.8, 1, -1.4, 1.8, -2.2, 1.2, -1, 2, -1.6, 1.4, -2, 1.1, -1.3, 1.7];
    const ys = [0, 34, 12, 0, 40, 16, 8, 0, 36, 10, 30, 0, 22, 6, 38, 14, 0, 26];
    document.getElementById('b-grid').innerHTML = home.map((c, i) => {
      const p = project(c.slug), span = bSpans[i];
      return `<article class="card b-card" data-size="${size(span + 1)}" style="--span:${span};--tspan:${span >= 5 ? 6 : 3};--turn:${turns[i]}deg;--y:${ys[i]}px;--tape:${turns[(i + 5) % 18] * 1.5}deg;--lturn:${-turns[i] / 2}deg">
        <figure class="print" style="margin:0"><img src="${img(c)}" alt="${esc(c.alt)}" loading="lazy" style="object-position:${c.gridPosition || c.position}"><figcaption class="note">${esc((window.PERSONAL_TOUCHES[c.slug] || {}).note || '')}</figcaption></figure>
        <div class="label"><div class="top-line">${brand(p)}</div><h3 class="title">${esc(p.title)}</h3><p class="desc">${esc(p.deck)}</p><p class="role">My role · <b>${esc(p.role)}</b></p></div></article>`;
    }).join('');

    // B1 · handwritten sticky note on each print; the explanation typed below.
    const note = c => esc((window.PERSONAL_TOUCHES[c.slug] || {}).note || '');
    const bCard = (c, i, body) => {
      const p = project(c.slug), span = bSpans[i];
      return `<article class="card b-card" data-size="${size(span + 1)}" style="--span:${span};--tspan:${span >= 5 ? 6 : 3};--turn:${turns[i]}deg;--y:${ys[i]}px;--sturn:${turns[(i + 7) % 18] * 1.3}deg">${body(p)}</article>`;
    };
    const sPos = ['br', 'tl', 'rm', 'bl', 'tr', 'br', 'lm', 'tr', 'bl', 'br', 'tl', 'rm', 'bl', 'tr', 'br', 'lm', 'tl', 'br'];
    const sRot = [4, -6, 3, -3, 6, -2, 5, -5, 2, -4, 6, -3, 4, -6, 3, -2, 5, -4];
    const sCol = ['y', 'p', 'y', 'b', 'y', 'y', 'p', 'y', 'b', 'y', 'p', 'y', 'y', 'b', 'p', 'y', 'y', 'b'];
    const sWid = [46, 42, 40, 48, 44, 50, 40, 46, 42, 48, 44, 40, 50, 42, 46, 40, 44, 48];
    const sFix = ['pin', 'tape', '', 'tape', 'pin', '', 'pin', '', 'tape', 'pin', '', 'tape', '', 'pin', 'tape', '', 'pin', 'tape'];
    const capFor = pos => pos === 'bl' ? 'cap-right' : pos === 'br' ? '' : 'cap-full';
    document.getElementById('b1-grid').innerHTML = home.map((c, i) => bCard(c, i, p => `
      <figure class="print" style="margin:0"><img src="${img(c)}" alt="${esc(c.alt)}" loading="lazy" style="object-position:${c.gridPosition || c.position}"><div class="sticky pos-${sPos[i]} c-${sCol[i]}${sFix[i] ? ' fix-' + sFix[i] : ''}" style="--sturn:${sRot[i]}deg;--sw:${sWid[i]}%">${note(c)}</div></figure>
      <div class="caption ${capFor(sPos[i])}">${brand(p)}<h3 class="title">${esc(p.title)}</h3><p class="desc">${esc(p.deck)}</p><p class="role">My role · <b>${esc(p.role)}</b></p></div>`)).join('');
    document.getElementById('b1-grid').closest('.direction').classList.add('b1');

    // B2 · everything handwritten on a sticky note under the print.
    const b2Side = ['r', 'l', 'r', 'r', 'l', 'r', 'l', 'r', 'l', 'r', 'r', 'l', 'r', 'l', 'r', 'r', 'l', 'r'];
    const b2Top = [-30, -14, -38, -20, -26, -12, -34, -18, -40, -24, -16, -30, -22, -36, -14, -28, -20, -32];
    const b2X = [0, 14, -10, 18, -14, 8, -6, 12, -18, 6, 16, -8, 10, -12, 4, -16, 12, -4];
    const b2Rot = [2, -3, 4, -2, 3, -4, 2, -3, 5, -2, 3, -4, 2, -3, 4, -2, 3, -3];
    const b2W = [88, 82, 90, 84, 86, 80, 88, 84, 90, 82, 86, 84, 88, 80, 86, 90, 84, 88];
    document.getElementById('b2-grid').innerHTML = home.map((c, i) => bCard(c, i, p => `
      <figure class="print" style="margin:0"><img src="${img(c)}" alt="${esc(c.alt)}" loading="lazy" style="object-position:${c.gridPosition || c.position}"></figure>
      <div class="sticky side-${b2Side[i]} c-${sCol[i]}${sFix[i] ? ' fix-' + sFix[i] : ''}" style="--st:${b2Top[i]}px;--sx:${b2X[i]}px;--sturn:${b2Rot[i]}deg;--sw:${b2W[i]}%">${brand(p)}<div class="s-title">${esc(p.title)}</div><div class="s-desc">${esc(p.deck)}</div><div class="s-role">my role · ${esc(p.role)}</div></div>`)).join('');
    document.getElementById('b2-grid').closest('.direction').classList.add('b2');

    // C · one room per project: big and compact rows alternate sides.
    const bigRows = new Set([0, 2, 5, 7, 12, 14]);
    document.getElementById('c-list').innerHTML = home.map((c, i) => {
      const p = project(c.slug), big = bigRows.has(i);
      return `<article class="card c-row${big ? '' : ' compact'}${i % 2 ? ' flip' : ''}" style="--cols:${big ? 'minmax(0,1.5fr) minmax(0,1fr)' : 'minmax(0,1fr) minmax(0,1.4fr)'};--turn:${i % 2 ? 0.7 : -0.7}deg">
        <figure class="print" style="margin:0"><img src="${img(c)}" alt="${esc(c.alt)}" loading="lazy" style="object-position:${c.gridPosition || c.position}"></figure>
        <div><h3 class="title">${esc(p.title)}</h3><p class="desc">${esc(p.deck)}</p><p class="role">My role · <b>${esc(p.role)}</b></p>${brand(p)}</div></article>`;
    }).join('');

    const show = v => {
      document.querySelectorAll('.direction').forEach(d => d.classList.toggle('on', d.id === v));
      document.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
    };
    document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => { show(b.dataset.v); history.replaceState(null, '', '?v=' + b.dataset.v); }));
    show(new URLSearchParams(location.search).get('v') || 'a');
  </script>
</body>
</html>
